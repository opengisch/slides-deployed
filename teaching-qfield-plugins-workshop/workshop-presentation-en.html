### Why plugins for QField?

+ Address clients specific needs
+ Keeping the UX simple
+ QField is *your* tool

---

### Types of QField Plugins

PROJECT PLUGINS | APPLICATION PLUGINS
----------------|--------------------
Shared alongside QField project | Shared via URL (ZIP file)
Single plugin | Multiple plugins
Installation not required | Required installation
Lasts project session | Lasts QField session

<aside class="notes">

Project plugins don't need any knowhow to load and can be distributet over the cloud.

</aside>

### \.\./Attributes

```Properties, Signals, Handlers and Methods```

----

<span style="font-size:0.85em;">

``` qml
Rectangle {
  color: "green"

  MouseArea {

    anchors.fill: parent

    onClicked: myCustomMethod()
    
    function myCustomMethod() {

      parent.color = "red"

    }
  }
}
```
</span>

--v--

### \.\./Attributes

```Properties, Signals, Handlers and Methods```

----

<span style="font-size:0.85em;">

``` qml
Rectangle {    
  color: theColor
  property var theColor: "green"

  MouseArea {
    
    anchors.fill: parent

    onClicked: {

      parent.theColor = "red"

    }
  }
}
```
</span>


<aside class="notes">
Example for a property binding. color is connected over theColor. When theColor changes, color changes as well.
Of course here the result will be the same like before and it makes not much sense to implement this. But...
</aside>

--v--

### \.\./Attributes

```Properties, Signals, Handlers and Methods```

----

<span style="font-size:0.85em;">

``` qml
Rectangle {    
  color: theColor
  property var theColor: "green"

  MouseArea {
    
    anchors.fill: parent

    onClicked: {
      if (theColor == "green") {
          theColor = "red"
      } else {
          theColor = "green"
      }
    }
  }
}
```
</span>

<aside class="notes">
Show it... We can not make `if(parent.color == "green")` because color is not a string but a color property.
</aside>

--v--

### \.\./Attributes

```Properties, Signals, Handlers and Methods```

----

<span style="font-size:0.85em;">

``` qml
Rectangle {    
  color: isGreen ? "red" : "green"
  property bool isGreen: true

  MouseArea {
    
    anchors.fill: parent

    onClicked: {
      isGreen = !isGreen
    }
  }
}
```
</span>

<aside class="notes">
Or an alternative way to show this behavior to explain the power of bindings.
</aside>

--v--

### \.\./Attributes

```Properties, Signals, Handlers and Methods```

----

<span style="font-size:0.85em;">

``` qml
Rectangle {
  color: "green"

  MouseArea {

    anchors.fill: parent

    onClicked: { parent.color = "red" }
  }
}





```
</span>

<aside class="notes">
Again is an event called `clicked` in MouseArea. To handle this event, we have the handler `onClicked`.
Those follow the signal-slot technic. But we can do signal-slots also ourself.
</aside>

--v--

### \.\./Attributes

```Properties, Signals, Handlers and Methods```

----

<span style="font-size:0.85em;">

``` qml
Rectangle {
  color: "green"
      
  signal colorChanged(info: string)

  MouseArea {

    anchors.fill: parent

    onClicked: {
      parent.color = "red"
      parent.colorChanged("by in the mouse area")
    }
  }

  onColorChanged: {
    console.log("Color changed to:", parent.color, " info:", info)
  }
}
```
</span>

### Weather Forecast plugin

Let's create a forecast plugin!

--v--

### \.\./What we need

 + Button to fetch a weather forecast *(reuse the edited template plugin)*
 + Show an info dialog *(reuse the edited template plugin)*
 + Our location *(reuse the edited template plugin)*
 + API call
   + `XmlHttpRequest` to do an API call and fetch the forecast from open-meteo.com
 + Whatever we want

--v--

### \.\./What we do

 + Check out open-meteo.com
 + Get snippets at pad.opengis.ch (or the slides below)
 + We test the Java Script at https://runjs.app/play
 + We map the weather code to description and image
 + We integrate it into our template plugin

--v--

### \.\./API Request snippet

The Java Script for using `XmlHttpRequest`

``` JavaScript
//Norrköping
lat = 58.5833;
lon = 16.1833;

let request = new XMLHttpRequest();

request.onreadystatechange = function() {
  if (request.readyState === XMLHttpRequest.DONE) {
    console.log(request.response)
  }
}

request.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&daily=weather_code,temperature_2m_max&timezone=auto");

request.send();

```
