## Plugin para pronóstico del tiempo (Weather Forecast) 🧑‍💻

¿Qué necesitamos?

 + [ ] 1) API call (open-meteo.com)
    + [ ] Build a URL (to call the API) from the web site
    + [ ] Call the API via XMLHttpRequest
    + [ ] Translate API response into image / description
 
 + [ ] 2) Plugin
    + [ ] Get location via button (from previous exercises)
    + [ ] Call the API from the plugin
