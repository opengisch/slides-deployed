### <span style="color: var(--opengisch-green)">QGIS</span> AUF EINEN BLICK

- 🌍 Von Millionen verwendet, weltweit — Städte, Wälder, Katastrophengebiete, Landwirtschaft, ...
- 💻 Läuft auf Linux, Windows, macOS — sowie Android, iOS via Apps
- 🗣️ Verfügbar in 100+ Sprachen dank einer globalen Community
- 🔁 Update alle 4 Monate mit regelmässigen Releases
- 📱 QField: Android: 1.5M, iOS: 350K, Rating: 4.8/5 ⭐
-
![fte](assets/users.jpg)

---

### QGIS IST EIN <span style="color: var(--opengisch-green);"> DIGITAL PUBLIC GOOD</span>
- ✅ Offiziell anerkannt bei der Digital Public Goods Alliance in 2025
- 🎯 Erfüllt die DPG Standards: open-source, respektiert die Privatsphäre, inklusiv, in Übereinstimmung mit den UN Sustainable Development Goals (SDGs)
- 🌱 Unterstützt globale Themen: Klima, Stadtplanung, Katastrophenhilfe, Öffentliche Gesundheit
- 🧩 Stärkt QGIS' Rolle in internationaler Zusammenarbeit — Speziell mit Regierungen, NGOs, und Bildung
- 🙌 Stärkt unser commitment, eine moderne digitale Infrastruktur zu bauen: offen, zugänglich und ethisch

note:
Diese Anerkennung öffnet die Türen für Zusammenarbeit und Finanzierung. Sie zeigt, dass QGIS nicht einfach ein Werkzeug ist, es ist ein öffentliches Gut, welches Menschen weltweit ermächtigt.

### COMMUNITY <span style="color: var(--opengisch-green);">ZUERST</span>

note:
Now, if there’s one thing I want to be absolutely clear about today, it’s this:
This project was started by a volunteer. It was grown by volunteers. And it’s sustained by people all over the world who believe in something bigger than only profit margins.
We now have 35 official user groups, spanning every continent. From grassroots hackfests to full-blown conferences. From quiet pull requests to life-changing deployments.
And that’s the secret: our strength is not just our code — it’s our community.

### FINANZIELLES WACHSTUM <span style="color: var(--opengisch-green);">& TRANSPARENZ</span>
##### Es ist nicht nur Wachstum — es geht darum <span style="font-weight: bold;" class="highlight-animate">wie wir es nutzen.</span>

- **Bug fixing** ist unser grösster Budgetposten — das hält QGIS stabil und bereit für den produktiven Einsatz
- **Infrastruktur** (Buildsysteme, Server, Paketierung) stellt sicher, dass wir zuverlässigen Skalieren
- **Dokumentation** erhält ein dediziertes Budget und eine Vollzeitstelle
- Und dann gibt es das **Grant Programm**, um Innovationen aus der Entwicklercommunity zu fördern

##### Alles ist öffentlich verfügbar in unseren financial reports.

note:
Celebrate the financial maturity of the project. This is community-powered sustainability.

- 🧱 Unterstützung im Kern: nicht extravagant, aber essenziell

### QT6

##### Umstieg auf <span style="color: var(--opengisch-green); font-weight: bold;">Qt6</span>, das moderne Applikationsframework, auf dem QGIS <span style="font-weight:bold;">gebaut ist.</span>

- Sicherheitsverbesserungen
- Moderne Codebasis mit vereinfachter Maintenance
- Updates von Abhängigkeiten

---

### QGIS <span style="color: var(--opengisch-green);">4.0</span>

- QGIS 4.0 wird ausschliesslich auf Basis von Qt6 sein
- Es sind keine grösseren Anpassungen an der API vorgesehen
- Die Arbeiten dafür laufen aktuell auf Hochtouren
- Der LTR kommt mit QGIS 4.2, geplant für ~Anfang~ Mitte 2026

##### <span style="font-weight: bold;" class="highlight-animate">Das Ziel:</span> den Umstieg so einfach und risikolos wie möglich zu machen.

note:
This is a massive change — but we’re ready for it. And we’re making it as developer-friendly as possible.

---

### MACOS <span style="color: var(--opengisch-green)">PAKETE</span>

- Wird nun mittels **vcpkg** gebaut, für einfacheren Unterhalt. Aufgebaut auf QField.
- Das erlaubt uns auch (endlich) **notarisierte Pakete** anzubieten — ein muss für moderne macOS Versionen
- QGIS 3.44 und Vorschauversionen für QGIS 4 auf macOS sind **verfügbar**
- https://github.com/qgis/qgis-notarize

##### Das bringt uns näher zu einer <span style="font-weight: bold;"> nahtlosen, professionellen Userexperience</span> auf allen grossen Plattformen.


note:
macOS users — we hear you! This is a big step forward for credibility and ease of use.
