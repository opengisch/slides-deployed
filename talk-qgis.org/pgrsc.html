### <span style="color: var(--opengisch-green)">QGIS</span> AT A GLANCE

- 🌍 Used by millions worldwide — across cities, forests, disaster zones, farms, ...
- 💻 Runs on Linux, Windows, macOS — and Android, iOS via apps
- 🗣️ Available in 100+ languages thanks to our global community
- 🔁 Updated every 4 months with regular releases

### QGIS IS A <span style="color: var(--opengisch-green);"> DIGITAL PUBLIC GOOD</span>
- ✅ Officially recognized by the Digital Public Goods Alliance in 2025
- 🎯 Meets DPG standards: open-source, privacy-respecting, inclusive, and aligned with the UN Sustainable Development Goals (SDGs)
- 🌱 Supports global causes: climate action, urban planning, disaster response, public health
- 🧩 Strengthens QGIS' role in international cooperation — especially with governments, NGOs, and educational institutions
- 🙌 Reinforces our commitment to building digital infrastructure that’s open, accessible, and ethical

note:
This recognition opens doors for collaboration and funding. It shows that QGIS isn't just a tool — it’s a public good that empowers people worldwide.

### COMMUNITY <span style="color: var(--opengisch-green);">FIRST</span>

<img src="assets/team.jpg" style="width: 70%; display: block; margin-left: 0;">

note:
Now, if there’s one thing I want to be absolutely clear about today, it’s this:
This project was started by a volunteer. It was grown by volunteers. And it’s sustained by people all over the world who believe in something bigger than only profit margins.
We now have 35 official user groups, spanning every continent. From grassroots hackfests to full-blown conferences. From quiet pull requests to life-changing deployments.
And that’s the secret: our strength is not just our code — it’s our community.

### FINANCIAL GROWTH <span style="color: var(--opengisch-green);">& TRANSPARENCY</span>
##### But it’s not just about growth — it’s about <span style="font-weight: bold;" class="highlight-animate">how we use it.</span>

- **Bug fixing** is our largest single allocation — this keeps QGIS stable and production-ready
- **Infrastructure** (build systems, servers, packaging) ensures we scale reliably
- **Documentation** gets a dedicated budget and full-time writer
- And then there’s the **Grant Programme**, supporting community-driven innovation

##### All of it is published publicly in our financial reports.

note:
Celebrate the financial maturity of the project. This is community-powered sustainability.

### QT6

##### Transitions to <span style="color: var(--opengisch-green); font-weight: bold;">Qt6</span>, the modern application framework that QGIS is <span style="font-weight:bold;">built on.</span>

- Security improvements
- Modern codebase with simplified maintenance
- Updated dependencies

---

### QGIS <span style="color: var(--opengisch-green);">4.0</span>

- QGIS 4.0 will be Qt6-only
- Tech preview around december 
- It won’t be an LTR, but will keep deprecated APIs to ease plugin transitions

---

### QGIS <span style="color: var(--opengisch-green);">4.0</span>

- 4.0 Coming February 2026
- The LTR will follow in QGIS 4.2, scheduled for mid 2026
- New welcome screen
  
![welcomescreen](assets/welcomescreen.jpg)

##### <span style="font-weight: bold;" class="highlight-animate">The goal:</span> make the transition as smooth and low-risk as possible.

note:
This is a massive change — but we’re ready for it. And we’re making it as developer-friendly as possible.

---

### MACOS PACKAGE <span style="color: var(--opengisch-green)">IMPROVEMENTS</span>

- Builds now use **vcpkg** for better maintainability
- This allows us to finally support **notarised builds** — a requirement for modern macOS versions
- It’s already proven to work — Already done for QField
- Notarised builds of QGIS for macOS are **available**
- 3.44 LTR + 4.0 dev

##### <span style="font-weight: bold;"> Seamless, professional user experience</span> across all major platforms.


note:
macOS users — we hear you! This is a big step forward for credibility and ease of use.

### <span style="color: var(--opengisch-green)">QGIS</span> FEED STRATEGY
##### Allows us to:

- Push out **short-lived, high-value news**
- Stay in sync with releases, updates, events
- Give you fresh content every few days

##### We’re aiming for frequent posts — with most having a <span style="font-weight:bolder">validity of 10 days or less</span>. It’s quick, timely, and always relevant.

note:
Keep an eye on it — and consider contributing your own updates!
