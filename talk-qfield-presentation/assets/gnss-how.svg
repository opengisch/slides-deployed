<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <symbol id="sat" viewBox="-64 -16 128 32" width="128" height="32" overflow="visible">
      <rect x="-62" y="-9" width="44" height="18" fill="#2880cc"/>
      <rect x="18" y="-9" width="44" height="18" fill="#2880cc"/>
      <path d="M-47 -9V9M-33 -9V9M33 -9V9M47 -9V9" stroke="#fff" stroke-width="1.5"/>
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#3a3a3a"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2880cc"/>
    </marker>
  </defs>

  <!-- atmosphere -->
  <rect x="0" y="175" width="1200" height="50" fill="#2880cc" opacity="0.08"/>
  <text x="20" y="196" font-size="18" fill="#2880cc">atmosphere</text>
  <text x="20" y="216" font-size="18" fill="#2880cc">slows the signal</text>

  <!-- valley -->
  <path d="M0 545L300 470L450 510L560 455L700 520L860 545Z" fill="#dbe9cf"/>
  <path d="M0 620V400L80 330L160 420L210 545H860L980 330L1060 380L1110 340L1200 400V620Z" fill="#c5dfae"/>

  <!-- signals: satellite to receiver -->
  <g stroke="#80cc28" stroke-width="3" stroke-dasharray="10 7" fill="none">
    <path d="M170 115L640 452"/>
    <path d="M430 45L640 452"/>
    <path d="M760 45L640 452"/>
    <path d="M1060 95L640 452"/>
  </g>

  <!-- reflection off the mountain -->
  <path d="M1060 95L926 427L644 455" stroke="#e8743b" stroke-width="3" stroke-dasharray="4 6" fill="none"/>
  <text x="790" y="478" font-size="18" fill="#e8743b" text-anchor="middle">reflection</text>

  <!-- satellites -->
  <use href="#sat" x="106" y="99"/>
  <use href="#sat" x="366" y="29"/>
  <use href="#sat" x="696" y="29"/>
  <use href="#sat" x="996" y="79"/>
  <text x="20" y="40" font-size="20" fill="#3a3a3a">Satellites send</text>
  <text x="20" y="64" font-size="20" fill="#3a3a3a">where and when</text>

  <!-- corrections -->
  <path d="M285 462L370 404" stroke="#2880cc" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M488 397L618 470" stroke="#2880cc" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="375" y="365" width="110" height="46" rx="23" fill="#2880cc"/>
  <text x="430" y="395" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">NTRIP</text>
  <text x="430" y="440" font-size="18" fill="#2880cc" text-anchor="middle">corrections</text>

  <!-- base station on a known point -->
  <g stroke="#3a3a3a" stroke-width="3" fill="none">
    <path d="M260 470V545M260 485L232 545M260 485L288 545"/>
  </g>
  <ellipse cx="260" cy="467" rx="22" ry="7" fill="#3a3a3a"/>
  <path d="M250 552L260 538L270 552Z" fill="#e8743b"/>
  <text x="260" y="580" font-size="18" fill="#3a3a3a" text-anchor="middle">Base station</text>
  <text x="260" y="602" font-size="18" fill="#3a3a3a" text-anchor="middle">on a known point</text>

  <!-- receiver -->
  <path d="M640 455V545" stroke="#3a3a3a" stroke-width="3"/>
  <ellipse cx="640" cy="452" rx="22" ry="7" fill="#80cc28"/>
  <rect x="646" y="484" width="18" height="28" rx="3" fill="#3a3a3a"/>
  <text x="640" y="580" font-size="18" fill="#3a3a3a" text-anchor="middle">Receiver: travel time → distance</text>
  <text x="640" y="602" font-size="18" fill="#3a3a3a" text-anchor="middle">4 satellites → position, height, clock</text>
</svg>
